[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tunecontrol"
version = "0.1.0"
description = "A benchmark suite for controller tuning."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENCE.txt"]
keywords = ["controller tuning", "bayesian optimization", "benchmark", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib",
    "torch>=2.2",
]

[project.optional-dependencies]
botorch = [
    "botorch==0.15.1",
]
dev = [
    "pytest",
    "ruff",
]

[project.urls]
Repository = "https://github.com/Data-Science-in-Mechanical-Engineering/tunecontrol"
Issues = "https://github.com/Data-Science-in-Mechanical-Engineering/tunecontrol/issues"
Documentation = "https://github.com/Data-Science-in-Mechanical-Engineering/tunecontrol/blob/main/README.md"
Paper = "https://arxiv.org/abs/2609.09403"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = false

[tool.setuptools.packages.find]
include = ["tunecontrol*"]
exclude = ["scratch*", "tests*", "docs*"]
namespaces = false
