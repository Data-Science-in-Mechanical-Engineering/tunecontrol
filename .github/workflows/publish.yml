name: Build, test, and publish

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag must match package version'
          PY
      - name: Build wheel from source distribution and validate metadata
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the built wheel
        run: python -m pip install dist/*.whl
      - name: Test installed package outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          MPLBACKEND: Agg
        run: python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Check optional BoTorch dependency resolution
        run: |
          WHEEL_URI=$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve().as_uri())')
          python -m pip install --dry-run "tunecontrol[botorch] @ $WHEEL_URI"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tunecontrol/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
